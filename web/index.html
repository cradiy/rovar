<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rovar</title>
  <link data-trunk rel="rust" href="../crates/rovar/Cargo.toml" data-bin="rovar" data-wasm-opt="0">
  <link data-trunk rel="rust" href="../crates/rovar-render/Cargo.toml" data-target-name="rovar_render" data-type="worker" data-bindgen-target="web" data-wasm-opt="0">
  <link data-trunk rel="copy-dir" href="fonts">
  <link data-trunk rel="copy-dir" href="shell">
  <link data-trunk rel="copy-file" href="../assets/rovar-mark.svg">
  <link rel="icon" type="image/svg+xml" href="rovar-mark.svg">
  <link rel="stylesheet" href="shell/style.css">
</head>
<body>
  <main id="shell">
    <section class="startup">
      <img src="rovar-mark.svg" width="40" height="40" alt="Rovar">
      <p id="loading" role="status">Loading Rovar…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <noscript>Enable JavaScript to open this workspace.</noscript>
    </section>
  </main>
  <div id="storage-status" role="status" hidden></div>
</body>
</html>
