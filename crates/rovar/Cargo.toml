[package]
name = "rovar"
version.workspace = true
edition = "2024"
authors.workspace = true
license = "MIT"
description = "A canvas-first desktop design editor"

[dependencies]
gpui = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }
gpui_icons = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f", features = ["all"] }
gpui_effects = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }
gpui_media = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f", default-features = false, features = [
  "video",
  "audio",
] }
gpui_media_backend = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
anyhow = "1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "wav", "all-meta"] }
i_overlay = "9"
kurbo = "0.13"
taffy = { version = "0.10.1", default-features = false, features = [
  "std",
  "taffy_tree",
  "flexbox",
  "grid",
  "detailed_layout_info",
  "block_layout",
] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = "0.14"
unic-langid = "0.9"
# Component baselines contain JSON numbers and must survive save/load unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive", "rc"] }
rovar-format = { path = "../rovar-format" }
rovar-api = { path = "../rovar-api" }
futures-channel = "0.3"
futures-util = "0.3"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "0.3"
dirs = "7"
rovar-storage = { path = "../rovar-storage" }
rovar-svg = { path = "../rovar-svg" }
web-time = "1"
time = { version = "0.3", features = ["formatting"] }
uic = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }
unicode-segmentation = "1.12"
unicode-linebreak = "0.1"

[target.'cfg(any(unix, windows))'.dependencies]
semver = "1"
clap = { version = "4", features = ["derive"] }
schemars = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["static-dxc"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
whoami = "2.1.3"
resvg = "0.48"
rovar-svg = { path = "../rovar-svg", features = ["parse"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
gpui_platform = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }
font-kit = { git = "https://github.com/cradiy/font-kit", rev = "ef41ce125c6d92ce7af6c153df42dc3de81c8437" }

[target.'cfg(target_family = "wasm")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
uuid = { version = "1", features = ["js"] }
gpui_web = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Navigator"] }
console_error_panic_hook = "0.1"
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies.tempfile]
version = "3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f" }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
gpui = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "b5b0e74b97389bedf2a3ca7764b9fdc9fc7a0b8f", features = [
  "test-support",
] }
