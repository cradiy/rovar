[package]
name = "rovar"
version = "0.1.0"
edition = "2024"
authors = ["cradiy <cradiy.rs@gmail.com>"]
license = "MIT"
description = "A canvas-first desktop design editor"

[dependencies]
gpui = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1" }
gpui_effects = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1" }
gpui_media = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1", default-features = false, features = [
  "video",
] }
gpui_media_backend = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1" }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
anyhow = "1"
taffy = { version = "0.10.1", default-features = false, features = [
  "std",
  "taffy_tree",
  "flexbox",
  "block_layout",
] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = "0.14"
unic-langid = "0.9"
# Component baselines contain JSON numbers and must survive save/load unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive", "rc"] }
rovar-format = { path = "../rovar-format" }
rovar-api = { path = "../rovar-api" }
futures-channel = "0.3"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "0.3"
dirs = "7"
rovar-storage = { path = "../rovar-storage" }
web-time = "1"
time = { version = "0.3", features = ["formatting"] }
uic = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1" }
unicode-segmentation = "1.12"
unicode-linebreak = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
resvg = "0.48"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
gpui_platform = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1", features = ["font-kit", "wayland", "x11"] }
font-kit = { git = "https://github.com/cradiy/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }

[target.'cfg(target_family = "wasm")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["js"] }
gpui_web = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Navigator"] }
console_error_panic_hook = "0.1"
rust-embed = { version = "8", features = ["debug-embed"] }

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies]
gpui = { git = "https://github.com/cradiy/gpui-fusion.git", rev = "9a21b6a06b68084cd15de1c2324cee148e6742c1", features = [
  "test-support",
] }
