[package]
name = "rovar"
version = "0.1.0"
edition = "2024"
authors = ["cradiy <cradiy.rs@gmail.com>"]
license = "MIT"
description = "A canvas-first desktop design editor"

[dependencies]
gpui = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a" }
gpui_effects = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a" }
gpui_media = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a", default-features = false, features = [
  "video",
] }
gpui_media_backend = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a" }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
anyhow = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = "0.14"
unic-langid = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
rovar-format = { path = "../rovar-format" }
resvg = "0.48"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "0.3"
dirs = "7"
tempfile = "3"
gpui_platform = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a", features = [
  "font-kit",
  "wayland",
  "x11",
] }
uic = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a" }
unicode-segmentation = "1.12"
unicode-linebreak = "0.1"
font-kit = { git = "https://github.com/cradiy/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }

[dev-dependencies]
gpui = { git = "https://github.com/cradiy/gpui.git", rev = "b73bb448ab81c4027a58f8e5bb23335a3e5b623a", features = [
  "test-support",
] }
